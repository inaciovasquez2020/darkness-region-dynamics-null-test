name: Darkness null-test regression

on:
  push:
    branches:
      - proof/uncertainty-reconstruction-null-gates-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest==8.3.5
      - name: Record exact HEAD
        run: |
          echo "CHECKED_HEAD=$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Full regression suite
        run: python -m pytest -q tests
      - name: Legacy theorem artifact verifier
        run: python tools/verify_dark_region_dynamics_null_test.py
      - name: Verify source tree unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

name: zlg-mc4-finite-sweep
on:
  push:
    branches:
      - scratch/zlg-mc4-finite-20260828
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run exact level-4 anti-period certificate
        run: python3 scratch/zlg_antiperiod_certificate.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zlg-antiperiod
          path: /tmp/zlg_antiperiod.json
          if-no-files-found: ignore

name: zlg-mc4-finite-sweep
on:
  push:
    branches:
      - scratch/zlg-mc4-finite-20260828
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run unified exact ZLG level-4 certificate
        run: python3 scratch/zlg_level4_complete.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zlg-level4-complete
          path: /tmp/zlg_level4_complete.json
          if-no-files-found: ignore

name: zlg-mc5-dim8-antiperiod
on:
  push:
    branches:
      - scratch/zlg-mc4-finite-20260828
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run MC5 dim8 anti-period fingerprint test
        run: python3 scratch/zlg_mc5_dim8_antiperiod_fingerprint.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zlg-mc5-dim8-fp
          path: /tmp/zlg_mc5_dim8_fp.json
          if-no-files-found: error

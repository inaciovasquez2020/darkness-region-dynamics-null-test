name: zlg-mc5-rank5-degenerate-defect
on:
  push:
    branches:
      - scratch/zlg-mc4-finite-20260828
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify rank-five prefix-degenerate sibling defect
        run: python3 scratch/zlg_mc5_rank5_degenerate_defect.py | tee /tmp/zlg_mc5_rank5_degenerate_defect.log
      - name: Upload verifier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zlg-mc5-rank5-degenerate-defect
          path: /tmp/zlg_mc5_rank5_degenerate_defect.log
          if-no-files-found: error
